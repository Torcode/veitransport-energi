[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veitransport-energi"
version = "0.1.0"
description = "Datalag og modeller for energiomstillingen i norsk veitransport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/Torcode/veitransport-energi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Fase 0-skriptene under analysis/ er frosset dokumentasjon av hva som faktisk ble
# kjørt i designporten, ikke bibliotekkode som vedlikeholdes. De holdes utenfor lint
# framfor å bli formatert om i ettertid — da ville sporet vært endret. Unntaket står
# her og ikke i CI-kommandoen, slik at `ruff check .` lokalt og i CI gir samme svar.
exclude = ["analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
