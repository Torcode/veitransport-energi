# PR-kontroller: raske, deterministiske tester UTEN nettverk.
# Kjører lint (ruff) og pytest mot committede uttrekk i data/extracts.
# Kildekontroller som krever nettverk hører IKKE hjemme her (egen, manuell workflow senere).
name: pr-kontroller

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kontroller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # R-broen skal ikke kunne hoppes over stille i CI: uten dette ville testene
      # meldt «skipped» på en runner uten R, og merket nedenfor lovet mer enn det
      # holdt. Med KREV_R=1 er et hopp en feil.
      KREV_R: "1"
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer pakken med utviklingsavhengigheter
        run: pip install -e ".[dev]"
      # Listen skal være identisk med KREVDE_PAKKER i R/kravpakker.R; en test
      # sammenligner de to, slik at et manglende navn her gir rødt før pushen
      # framfor å dukke opp som et notat som ikke lot seg bygge.
      - name: Installer R og pakkene R-laget krever
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-readr r-cran-dplyr r-cran-tidyr r-cran-tibble \
            r-cran-ggplot2 r-cran-scales r-cran-ragg r-cran-jsonlite \
            r-cran-digest r-cran-knitr
      - name: Lint (ruff)
        run: ruff check .
      - name: Tester (pytest, uten nettverk, mot committede uttrekk)
        run: pytest
      - name: Figurene skal kunne bygges på nytt fra artefaktene
        run: |
          Rscript R/bygg_figurer.R
          git diff --exit-code -- figurer/figurspor.json \
            || (echo "figurene i repoet er bygget fra et annet artefakt eller en annen kodeversjon enn den som ligger her — kjør Rscript R/bygg_figurer.R og commit resultatet" && exit 1)
